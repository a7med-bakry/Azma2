name: Extract Azama

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf azama_extract
          mkdir azama_extract

          unzip -o "azama-v1-github-fixed.zip" -d azama_extract

          cp azama_extract/index.html .
          cp azama_extract/styles.css .
          cp azama_extract/app.js .

          if [ -f azama_extract/README.md ]; then
            cp azama_extract/README.md .
          fi

          rm -rf azama_extract

      - name: Save files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html styles.css app.js README.md

          git diff --cached --quiet || git commit -m "Extract Azama files"

          git push
